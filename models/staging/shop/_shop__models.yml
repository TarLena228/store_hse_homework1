version: 2

models:
  - name: stg_shop__orders
    description: "Заказы из источника: одна строка — один заказ."
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shop__customers')
                field: customer_id
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['paid', 'pending', 'returned', 'cancelled', 'test']

  - name: stg_shop__customers
    description: "Клиенты из источника: одна строка — один клиент."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: stg_shop__order_items
    description: "Позиции заказов: одна строка — один товар в заказе."
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shop__orders')
                field: order_id

  - name: stg_shop__payments
    description: "Платёжные операции: одна строка — одна операция."
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shop__orders')
                field: order_id
      - name: payment_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['success', 'failed', 'pending']

  - name: stg_shop__products
    description: "Товары из источника."
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: stg_shop__product_categories
    description: "Категории товаров."
    columns:
      - name: category_id
        data_tests: [unique, not_null]