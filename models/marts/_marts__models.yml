version: 2

models:
  - name: fct_orders
    description: "Факт заказов: одна строка — один заказ. Тестовые заказы исключены."
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['paid', 'pending', 'returned', 'cancelled']
      - name: order_amount
        data_tests: [non_negative]
      - name: paid_amount
        data_tests: [non_negative]
      - name: refunded_amount
        data_tests: [non_negative]
      - name: is_confirmed
        description: "{{ doc('confirmed_order') }}"
        data_tests: [not_null]
      - name: items_count
        data_tests: [non_negative]

  - name: fct_order_items
    description: "Позиции заказов: одна строка — один товар в заказе."
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: order_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: quantity
        data_tests: [non_negative]
      - name: unit_price
        data_tests: [non_negative]
      - name: discount_amount
        data_tests: [non_negative]
      - name: line_amount
        data_tests: [non_negative]
      - name: is_confirmed
        description: "{{ doc('confirmed_order') }}"
        data_tests: [not_null]

  - name: dim_customers
    description: "Клиенты, включая не купивших. Одна строка — один клиент."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: dim_products
    description: "Товары с иерархией категорий. Одна строка — один товар."
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: dim_dates
    description: "Календарь. Одна строка — один день."
    columns:
      - name: date_day
        data_tests: [unique, not_null]